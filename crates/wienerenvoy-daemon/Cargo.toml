[package]
name = "wienerenvoy-daemon"
description = "WienerEnvoy daemon: Axum HTTP and WebSocket control plane, tailnet-only bind, bearer auth, granular power control."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme.workspace = true

[[bin]]
name = "wienerenvoy-daemon"
path = "src/main.rs"

[lib]
name = "wienerenvoy_daemon"
path = "src/lib.rs"

[features]
default = []
# Bake the static dashboard export into the binary for single-file release.
embed-ui = ["dep:rust-embed"]

[lints]
workspace = true

[dependencies]
wienerenvoy-core.workspace = true
wienerenvoy-platform-macos.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
secrecy = { workspace = true, features = ["serde"] }
rust-embed = { workspace = true, optional = true }

[dev-dependencies]
wienerenvoy-core = { workspace = true, features = ["testutil"] }
reqwest.workspace = true
tokio-test.workspace = true
