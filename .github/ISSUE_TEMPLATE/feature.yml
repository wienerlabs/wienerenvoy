name: Feature request
description: Suggest an idea for WienerEnvoy
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that WienerEnvoy does not let you do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: milestone
    attributes:
      label: Which area does this fit?
      options:
        - power and presence (M1)
        - container orchestration (M2)
        - tailscale integration (M3)
        - files and storage (M4)
        - media (M5)
        - backup / dns / observability (M6)
        - other
